<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form id="userForm" novalidate>
            <h2>Create Account</h2>
            
            <!-- Name Field -->
            <div class="form-group">
                <label for="username">Full Name</label>
                <input type="text" id="username" name="username" placeholder="e.g. Jane Doe">
                <small class="error-msg" id="nameError"></small>
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="e.g. jane@example.com">
                <small class="error-msg" id="emailError"></small>
            </div>

            <button type="submit">Submit</button>
            
            <!-- Success Message Container -->
            <div id="successMessage" class="success-msg"></div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
